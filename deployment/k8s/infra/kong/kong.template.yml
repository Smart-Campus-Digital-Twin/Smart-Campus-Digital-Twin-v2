_format_version: "3.0"
_transform: true

services:
  # ── Campus REST API ──────────────────────────────────────────────────────
  - name: campus-api
    url: http://api:8000
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: api-all
        paths: ["/api"]
        strip_path: true

  # ── WebSocket pass-through ───────────────────────────────────────────────
  - name: campus-api-ws
    url: http://api:8000
    routes:
      - name: api-ws
        paths: ["/ws"]
        strip_path: false

  # ── Keycloak auth endpoints ──────────────────────────────────────────────
  - name: keycloak-svc
    url: http://keycloak:8083
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: keycloak-auth
        paths: ["/auth"]
        strip_path: true
      - name: keycloak-resources
        paths: ["/resources"]
        strip_path: false

  # ── Grafana dashboards ───────────────────────────────────────────────────
  - name: grafana-svc
    url: http://grafana:3000
    routes:
      - name: grafana-ui
        paths: ["/grafana"]
        strip_path: true

  # ── Simulator UI ─────────────────────────────────────────────────────────
  - name: simulator-svc
    url: http://simulator.campus-simulator.svc.cluster.local:8002
    routes:
      - name: simulator-ui
        paths: ["/simulator"]
        strip_path: true

  # ── Mosquitto WebSocket ──────────────────────────────────────────────────
  - name: mosquitto-ws
    url: http://mosquitto:9001
    routes:
      - name: mqtt-ws
        paths: ["/mqtt"]
        strip_path: true

  # ── Frontend ─────────────────────────────────────────────────────────────
  - name: frontend-svc
    url: http://frontend:3000
    routes:
      - name: frontend-ui
        paths: ["/"]
        strip_path: false

plugins:
  # Global rate limiting
  - name: rate-limiting
    config:
      minute: 600
      policy: local

  # Global CORS
  - name: cors
    config:
      origins:
        - "http://localhost:3001"
        - "http://campus.local"
        - "http://localhost:80"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Authorization
        - Content-Type
        - Accept
        - X-Requested-With
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
      preflight_continue: false

  # JWT validation on /api — validates Keycloak RS256 tokens
  - name: jwt
    service: campus-api
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      run_on_preflight: false

consumers:
  - username: keycloak
    jwt_secrets:
      - key: "__JWT_ISSUER__"
        algorithm: RS256
        rsa_public_key: |
          __JWT_RSA_PUBLIC_KEY__
