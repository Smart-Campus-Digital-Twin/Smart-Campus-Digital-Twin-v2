apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: campus
data:
  # Kong declarative config is generated at runtime by kong-config-init.
  # In K8s, use the kong-config-init Job (PostSync hook) to render it,
  # then store the result in this ConfigMap via a kubectl patch in CI/CD,
  # or use an initContainer pattern shown below.
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    services:
      - name: campus-api
        url: http://api:8000
        connect_timeout: 10000
        read_timeout: 60000
        write_timeout: 60000
        routes:
          - name: api-all
            paths: ["/api"]
            strip_path: true
      - name: grafana-svc
        url: http://grafana:3000
        routes:
          - name: grafana-ui
            paths: ["/grafana"]
            strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 600
          policy: local
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type, Accept]
          max_age: 3600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      initContainers:
        - name: wait-keycloak
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              until curl -sf http://keycloak:8080/health/ready; do
                echo "Waiting for Keycloak..."; sleep 5
              done
      containers:
        - name: kong
          image: kong:3.7
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
          volumeMounts:
            - name: config
              mountPath: /kong/kong.yml
              subPath: kong.yml
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 150m
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: campus
spec:
  selector:
    app: kong
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      name: proxy
    - port: 8001
      targetPort: 8001
      name: admin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-ingress
  namespace: campus
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: campus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
