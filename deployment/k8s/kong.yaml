apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: campus
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      # ── Campus REST API ──────────────────────────────────────────────────────
      - name: campus-api
        url: http://api:8000
        connect_timeout: 10000
        read_timeout: 60000
        write_timeout: 60000
        routes:
          - name: api-all
            paths: ["/api"]
            strip_path: true

      # ── WebSocket pass-through ────────────────────────────────────────────
      - name: campus-api-ws
        url: http://api:8000
        routes:
          - name: api-ws
            paths: ["/ws"]
            strip_path: false

      # ── Keycloak auth endpoints ──────────────────────────────────────────
      - name: keycloak-svc
        url: http://keycloak:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: keycloak-auth
            paths: ["/auth"]
            strip_path: false

      # ── Grafana dashboards ───────────────────────────────────────────────
      - name: grafana-svc
        url: http://grafana:3000
        routes:
          - name: grafana-ui
            paths: ["/grafana"]
            strip_path: true

    plugins:
      # Global rate limiting
      - name: rate-limiting
        config:
          minute: 600
          policy: local

      # Global CORS — Frontend on campus.local talks to Kong
      - name: cors
        config:
          origins:
            - "http://localhost:3001"
            - "http://campus.local"
            - "http://localhost:80"
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers:
            - Authorization
            - Content-Type
            - Accept
            - X-Requested-With
          exposed_headers:
            - X-Auth-Token
          credentials: true
          max_age: 3600

      # JWT validation on /api routes (validates Keycloak-issued JWTs)
      # consumers + jwt secrets must be seeded separately (see docs)
      # Uncomment to enforce auth:
      # - name: jwt
      #   route: api-all
      #   config:
      #     uri_param_names: [jwt]
      #     cookie_names: []
      #     key_claim_name: iss
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      initContainers:
        - name: wait-keycloak
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              until curl -sf http://keycloak:8080/health/ready; do
                echo "Waiting for Keycloak..."; sleep 5
              done
        - name: wait-api
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              until curl -sf http://api:8000/api/health; do
                echo "Waiting for API..."; sleep 5
              done
      containers:
        - name: kong
          image: kong:3.7
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            # Needed to forward WebSocket upgrades
            - name: KONG_NGINX_HTTP_UPSTREAM_KEEPALIVE
              value: "60"
          volumeMounts:
            - name: config
              mountPath: /kong/kong.yml
              subPath: kong.yml
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: campus
spec:
  selector:
    app: kong
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      name: proxy
    - port: 8001
      targetPort: 8001
      name: admin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-ingress
  namespace: campus
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: campus.local
      http:
        paths:
          # All API + auth + grafana through Kong gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
          # Frontend served directly
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
