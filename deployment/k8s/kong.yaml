apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      initContainers:
        # Fetch Keycloak JWKS, derive issuer, render declarative kong.yml with JWT consumer
        - name: kong-config-render
          image: alpine:3.19
          env:
            - name: KEYCLOAK_INTERNAL_URL
              value: "http://keycloak:8080/auth"
            - name: KEYCLOAK_REALM
              value: "campus"
            - name: JWT_ISSUER
              value: "http://129.212.208.120/auth/realms/campus"
            - name: KONG_TEMPLATE_PATH
              value: "/template/kong.yml"
            - name: KONG_OUT_PATH
              value: "/kong-config/kong.yml"
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl python3 py3-requests py3-cryptography > /dev/null

              # Wait for Keycloak
              until curl -sf "${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}" > /dev/null 2>&1; do
                echo "Waiting for Keycloak..."; sleep 5
              done

              # Wait for API
              until curl -sf http://api:8000/health > /dev/null 2>&1; do
                echo "Waiting for API..."; sleep 5
              done

              echo "JWT issuer: ${JWT_ISSUER}"
              python3 /scripts/render_kong_config.py

          volumeMounts:
            - name: kong-template
              mountPath: /template
            - name: kong-render-scripts
              mountPath: /scripts
            - name: kong-config
              mountPath: /kong-config

      containers:
        - name: kong
          image: kong:3.7
          ports:
            - containerPort: 8000
              name: proxy
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong-config/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_NGINX_HTTP_UPSTREAM_KEEPALIVE
              value: "60"
          volumeMounts:
            - name: kong-config
              mountPath: /kong-config
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 300m
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20

      volumes:
        - name: kong-template
          configMap:
            name: kong-template
        - name: kong-render-scripts
          configMap:
            name: kong-render-scripts
        - name: kong-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: campus
spec:
  selector:
    app: kong
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      name: proxy
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-ingress
  namespace: campus
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: campus.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 80
