apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: campus-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: api-env
            - secretRef:
                name: postgres-env
            - secretRef:
                name: influxdb-env
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: campus
spec:
  selector:
    app: api
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
