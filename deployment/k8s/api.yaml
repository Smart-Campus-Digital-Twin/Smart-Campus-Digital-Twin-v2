apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: campus-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: campus-common
            - secretRef:
                name: campus-postgres
            - secretRef:
                name: campus-influxdb
          env:
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: campus
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
