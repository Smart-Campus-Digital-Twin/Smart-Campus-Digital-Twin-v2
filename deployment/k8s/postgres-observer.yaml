apiVersion: v1
kind: Pod
metadata:
  name: postgres-observer
  namespace: campus
  labels:
    app: postgres-observer
spec:
  containers:
    - name: adminer
      image: adminer:4.8.1
      ports:
        - containerPort: 8080
      env:
        - name: ADMINER_DEFAULT_SERVER
          value: postgres
      resources:
        requests:
          memory: 32Mi
          cpu: 25m
        limits:
          memory: 128Mi
          cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-observer
  namespace: campus
spec:
  selector:
    app: postgres-observer
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP