apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          command: ["start-dev"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: campus-common
            - secretRef:
                name: keycloak-env
          env:
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
          resources:
            requests:
              memory: 256Mi
              cpu: 150m
            limits:
              memory: 512Mi
              cpu: 400m
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: campus
spec:
  selector:
    app: keycloak
  type: LoadBalancer
  ports:
    - port: 8083
      targetPort: 8080
