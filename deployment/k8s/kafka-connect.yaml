# ─────────────────────────────────────────────────────────────────────────────
# Kafka Connect — lensesio/kafka-connect image bundles all stream-reactor
# connectors including the MQTT Source connector.
# REST API on port 8083. Connector configured via init Job (PostSync hook).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: campus
  labels:
    app: kafka-connect
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      initContainers:
        - name: wait-kafka
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              until curl -sf http://kafka-0.kafka.campus.svc.cluster.local:9092 2>/dev/null || \
                nc -z kafka-0.kafka.campus.svc.cluster.local 9092 2>/dev/null; do
                echo "Waiting for Kafka broker..."; sleep 5
              done
              echo "Kafka ready."
        - name: wait-mosquitto
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              until nc -z mosquitto 1883 2>/dev/null; do
                echo "Waiting for Mosquitto MQTT broker..."; sleep 5
              done
              echo "Mosquitto ready."
        - name: download-connector
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              apk add --no-cache curl unzip
              mkdir -p /opt/connectors/mqtt
              curl -L https://github.com/lensesio/stream-reactor/releases/download/11.7.2/kafka-connect-mqtt-11.7.2.zip -o /tmp/mqtt.zip
              unzip /tmp/mqtt.zip -d /opt/connectors/mqtt
          volumeMounts:
            - name: connectors
              mountPath: /opt/connectors
      containers:
        - name: kafka-connect
          image: confluentinc/cp-kafka-connect:7.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: rest-api
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka.campus.svc.cluster.local:9092"
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_GROUP_ID
              value: "campus-connect-group"
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: "_connect-configs"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: "_connect-offsets"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: "_connect-status"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER
              value: "org.apache.kafka.connect.storage.StringConverter"
            - name: CONNECT_VALUE_CONVERTER
              value: "org.apache.kafka.connect.converters.ByteArrayConverter"
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CONNECT_PLUGIN_PATH
              value: "/usr/share/java,/usr/share/confluent-hub-components,/opt/connectors"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: campus-mqtt
                  key: MQTT_USERNAME
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-mqtt
                  key: MQTT_PASSWORD
          volumeMounts:
            - name: connectors
              mountPath: /opt/connectors
          resources:
            requests:
              memory: 2Gi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 240
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 240
            periodSeconds: 30
      volumes:
        - name: connectors
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: campus
spec:
  selector:
    app: kafka-connect
  ports:
    - port: 8083
      targetPort: 8083
      name: rest-api
---
# ─────────────────────────────────────────────────────────────────────────────
# Post-sync Job: register the MQTT source connector via Kafka Connect REST API.
# Runs after all resources are synced (ArgoCD PostSync hook).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-connect-mqtt-init
  namespace: campus
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: connector-init
          image: curlimages/curl:8.7.1
          env:
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: campus-mqtt
                  key: MQTT_USERNAME
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-mqtt
                  key: MQTT_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e
              CONNECT_URL="http://kafka-connect:8083"

              # Wait for Connect REST API to be ready
              until curl -sf "${CONNECT_URL}/connectors"; do
                echo "Waiting for Kafka Connect REST API..."; sleep 10
              done

              echo "Registering MQTT Source connector..."

              # Register (or update) the MQTT source connector
              curl -sf -X PUT "${CONNECT_URL}/connectors/campus-mqtt-source/config" \
                -H "Content-Type: application/json" \
                -d "{
                  \"connector.class\": \"com.datamountaineer.streamreactor.connect.mqtt.source.MqttSourceConnector\",
                  \"tasks.max\": \"1\",
                  \"connect.mqtt.hosts\": \"tcp://mosquitto:1883\",
                  \"connect.mqtt.username\": \"${MQTT_USERNAME}\",
                  \"connect.mqtt.password\": \"${MQTT_PASSWORD}\",
                  \"connect.mqtt.service.quality\": \"1\",
                  \"connect.mqtt.clean\": \"true\",
                  \"connect.mqtt.client.id\": \"campus-connect-mqtt\",
                  \"connect.mqtt.kcql\": \"INSERT INTO sensors.temperature SELECT * FROM campus/temperature; INSERT INTO sensors.occupancy SELECT * FROM campus/occupancy; INSERT INTO sensors.energy SELECT * FROM campus/energy\",
                  \"value.converter\": \"org.apache.kafka.connect.converters.ByteArrayConverter\",
                  \"key.converter\": \"org.apache.kafka.connect.storage.StringConverter\"
                }"

              echo "MQTT connector registered successfully."

              # Verify connector is running
              sleep 5
              STATUS=$(curl -sf "${CONNECT_URL}/connectors/campus-mqtt-source/status" | grep -o '"state":"[A-Z]*"' | head -1)
              echo "Connector status: ${STATUS}"
