apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
        - name: bridge
          image: campus-bridge:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: campus-common
            - secretRef:
                name: campus-mqtt
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
