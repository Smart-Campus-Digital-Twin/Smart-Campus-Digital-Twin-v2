name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint + Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shared/requirements.txt
          pip install -r api/requirements.txt
          pip install -r bridge/requirements.txt
          pip install -r simulator/requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Lint with ruff
        run: |
          ruff check shared/ api/ bridge/ simulator/ processing/spark/ airflow/ tests/ \
            --ignore E501,E402

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Minimal secrets so config validators don't abort at import
          INFLUXDB_TOKEN: ci-test-token-not-real
          DATABASE_URL:   postgresql://campus:ci-pass@localhost:5432/campus
          MQTT_USERNAME:  ci-user
          MQTT_PASSWORD:  ci-pass
        run: |
          pytest tests/ \
            --ignore=tests/test_anomaly_rules.py \
            -v \
            --tb=short \
            --cov=shared --cov=api --cov=bridge --cov=simulator \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile -t campus-api:ci .

      - name: Build bridge image
        run: docker build -f bridge/Dockerfile -t campus-bridge:ci .
