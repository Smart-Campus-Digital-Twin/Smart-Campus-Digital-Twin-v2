name: Build & Push Docker Images

on:
  push:
    branches-ignore: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: campus-api
            dockerfile: api/Dockerfile
            context: .

          - service: campus-bridge
            dockerfile: bridge/Dockerfile
            context: .

          - service: campus-simulator
            dockerfile: simulator/Dockerfile
            context: .

          - service: campus-frontend
            dockerfile: infra/frontend/Dockerfile
            context: .

          - service: campus-spark
            dockerfile: infra/spark/Dockerfile
            context: .
            target: cluster

          - service: campus-flink
            dockerfile: processing/flink/Dockerfile
            context: .
            target: cluster

          - service: campus-flink-submit
            dockerfile: processing/flink/Dockerfile
            context: .

          - service: campus-ml-training
            dockerfile: ml/Dockerfile
            context: .
            target: training

          - service: campus-ml-inference
            dockerfile: ml/Dockerfile
            context: .
            target: inference

          - service: campus-airflow
            dockerfile: airflow/Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
