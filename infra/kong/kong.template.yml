_format_version: "3.0"
_transform: true

services:
  - name: campus-api
    url: http://api:8000
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: api-all
        paths:
          - "/"
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 600
      policy: local

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      max_age: 3600

  - name: jwt
    service: campus-api
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      run_on_preflight: false

consumers:
  - username: keycloak
    jwt_secrets:
      - key: "__JWT_ISSUER__"
        algorithm: RS256
        rsa_public_key: |
          __JWT_RSA_PUBLIC_KEY__
